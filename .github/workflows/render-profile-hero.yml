name: Render cinematic profile hero

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/gerar_hero_perfil.py"
      - ".github/workflows/render-profile-hero.yml"

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight render dependencies
        run: python -m pip install --no-cache-dir "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"

      - name: Render seamless animated profile hero
        run: python scripts/gerar_hero_perfil.py

      - name: Publish rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-perfil-animado.webp assets/hero-perfil-estatico.png assets/painel-identidade.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: render seamless landscape and identity hero"
            git push origin HEAD:main
          fi
